<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيخ ستور - المول الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: "Cairo", sans-serif; background: #000000; }
        .btn-green { background: #10B981; }
        .btn-red { background: #EF4444; }
        .btn-blue { background: #3B82F6; }
        .card { background: #111111; border: 1px solid #222222; }
        .card:hover { border-color: #3B82F6; transform: translateY(-4px); transition: 0.3s; }
    </style>
</head>
<body class="text-white">
    <!-- الهيدر -->
    <nav class="bg-black p-4 sticky top-0 z-50 border-b border-gray-900">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-black"><span class="text-blue-500">شيخ</span> ستور</h1>
            <button onclick="toggleCart()" class="relative btn-blue px-4 py-2 rounded-lg">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full w-5 h-5 flex items-center justify-center">0</span>
            </button>
        </div>
    </nav>

    <!-- الشركات -->
    <div class="container mx-auto p-6">
        <h2 class="text-2xl font-bold mb-6 text-center">اختر المتجر</h2>
        <div id="companiesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-10"></div>

        <!-- المنتجات -->
        <h2 id="productsTitle" class="text-2xl font-bold mb-6 hidden">منتجات <span id="currentCompany"></span></h2>
        <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
    </div>

    <!-- السلة -->
    <div id="cartSidebar" class="fixed top-0 left-0 w-full md:w-96 h-full bg-black shadow-2xl transform -translate-x-full transition-transform z-50 p-6 overflow-y-auto border-r border-gray-900">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold">سلة المشتريات</h3>
            <button onclick="toggleCart()"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        <div id="cartItems"></div>
        <div class="border-t border-gray-800 mt-6 pt-4">
            <div class="flex justify-between text-xl font-bold mb-4">
                <span>الإجمالي:</span>
                <span id="cartTotal" class="text-green-500">0 ل.س</span>
            </div>
            <input id="customerName" type="text" placeholder="الاسم" class="w-full p-3 mb-3 rounded bg-gray-900 border border-gray-800">
            <input id="customerPhone" type="tel" placeholder="رقم الموبايل" class="w-full p-3 mb-3 rounded bg-gray-900 border border-gray-800">
            <textarea id="customerAddress" placeholder="العنوان" class="w-full p-3 mb-3 rounded bg-gray-900 border border-gray-800"></textarea>
            <button onclick="submitOrder()" class="w-full btn-green p-4 rounded-lg font-bold text-lg">
                <i class="fa-solid fa-check"></i> تأكيد الطلب
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { /* حط كونفيغ Firebase تبعك */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];
        let currentCompanyId = null;// تحميل الشركات
        async function loadCompanies() {
            const querySnapshot = await getDocs(collection(db, "sheikh_companies"));
            const grid = document.getElementById('companiesGrid');
            grid.innerHTML = querySnapshot.docs.map(doc => {
                const c = doc.data();
                return 
                    <button onclick="loadCompanyProducts('${doc.id}', '${c.name}')" class="card p-4 rounded-xl text-center">
                        <img src="${c.logo}" class="w-16 h-16 mx-auto rounded-full mb-2 object-cover">
                        <p class="font-bold text-sm">${c.name}</p>
                        <p class="text-xs text-gray-500">${c.category}</p>
                    </button>
                ;
            }).join('');
        }

        // تحميل منتجات شركة محددة
        window.loadCompanyProducts = async (companyId, companyName) => {
            currentCompanyId = companyId;
            document.getElementById('productsTitle').classList.remove('hidden');
            document.getElementById('currentCompany').textContent = companyName;
            
            const q = query(collection(db, "sheikh_products"), where("companyId", "==", companyId));
            const querySnapshot = await getDocs(q);
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = querySnapshot.docs.map(doc => {
                const p = doc.data();
                return 
                    <div class="card rounded-xl overflow-hidden">
                        <img src="${p.image}" class="w-full h-40 object-cover">
                        <div class="p-3">
                            <h3 class="font-bold text-sm h-10">${p.name}</h3>
                            <div class="flex justify-between items-center mt-3">
                                <span class="text-lg font-bold text-green-500">${p.price}</span>
                                <button onclick='addToCart(${JSON.stringify({...p, id: doc.id})})' class="btn-blue px-3 py-1 rounded text-sm">
                                    <i class="fa-solid fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                ;
            }).join('');
        }

        window.addToCart = (product) => {
            const existing = cart.find(i => i.id === product.id);
            if (existing) existing.qty++;
            else cart.push({ ...product, qty: 1, companyId: currentCompanyId });
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').textContent = cart.reduce((a,b) => a + b.qty, 0);
            const cartItems = document.getElementById('cartItems');
            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return 
                    <div class="flex justify-between items-center mb-3 card p-3 rounded">
                        <div>
                            <p class="font-bold text-sm">${item.name}</p>
                            <p class="text-xs text-gray-400">${item.price} × ${item.qty}</p>
                        </div>
                        <span class="font-bold text-green-500">${item.price * item.qty}</span>
                    </div>
                ;
            }).join('');
            document.getElementById('cartTotal').textContent = total + ' ل.س';
        }

        window.toggleCart = () => document.getElementById('cartSidebar').classList.toggle('-translate-x-full');

        window.submitOrder = async () => {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;
            if (!name  !phone  !address || cart.length === 0) return alert('عبي كل البيانات');// تجميع الطلبات حسب الشركة
            const ordersByCompany = {};
            cart.forEach(item => {
                if (!ordersByCompany[item.companyId]) ordersByCompany[item.companyId] = [];
                ordersByCompany[item.companyId].push(item);
            });

            for (const [companyId, items] of Object.entries(ordersByCompany)) {
                await addDoc(collection(db, "sheikh_orders"), {
                    customer: { name, phone, address },
                    items: items,
                    total: items.reduce((a,b) => a + b.price * b.qty, 0),
                    status: "طلب جديد",
                    companyId: companyId,
                    createdAt: serverTimestamp()
                });
            }
            alert('✅ تم استلام طلبك! رح تتصل فيك كل شركة لتأكيد طلبها');
            cart = []; updateCart(); toggleCart();
        }

        loadCompanies();
    </script>
</body>
</html>
