<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيخ ستور - المول الإلكتروني الفخم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: "Cairo", sans-serif; }
        body { background: #000000; color: #fff; }
      .glass { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
      .btn-neon-green { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); transition: all 0.3s; }
      .btn-neon-green:hover { box-shadow: 0 0 30px rgba(16, 185, 129, 0.7); transform: translateY(-2px); }
      .btn-neon-blue { background: linear-gradient(135deg, #3B82F6, #1D4ED8); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); transition: all 0.3s; }
      .btn-neon-blue:hover { box-shadow: 0 0 30px rgba(59, 130, 246, 0.7); transform: translateY(-2px); }
      .btn-neon-red { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); transition: all 0.3s; }
      .card-glow { background: linear-gradient(145deg, #111111, #0A0A0A); border: 1px solid #1F1F1F; transition: all 0.4s ease; }
      .card-glow:hover { border-color: #3B82F6; box-shadow: 0 10px 40px rgba(59, 130, 246, 0.2); transform: translateY(-8px); }
      .gradient-text { background: linear-gradient(90deg, #3B82F6, #10B981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .status-new { color: #3B82F6; }
      .status-prep { color: #F59E0B; }
      .status-done { color: #10B981; }
    </style>
</head>
<body>
    <nav class="glass sticky top-0 z-50 border-b border-gray-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg btn-neon-blue flex items-center justify-center">
                    <i class="fa-solid fa-crown text-xl"></i>
                </div>
                <h1 class="text-3xl font-black">شيخ <span class="gradient-text">ستور</span></h1>
            </div>
            <div class="flex gap-3">
                <button onclick="showTrackOrder()" class="btn-neon-green px-4 py-3 rounded-xl font-bold">
                    <i class="fa-solid fa-truck-fast ml-2"></i> تتبع طلبي
                </button>
                <button onclick="toggleCart()" class="relative btn-neon-blue px-5 py-3 rounded-xl font-bold">
                    <i class="fa-solid fa-cart-shopping ml-2"></i> السلة
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-gradient-to-r from-red-500 to-pink-500 text-xs rounded-full w-6 h-6 flex items-center justify-center font-black">0</span>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-6">
        <div class="text-center mb-8 mt-8">
            <h2 class="text-5xl font-black mb-4">أفخم <span class="gradient-text">مول إلكتروني</span></h2>
            <p class="text-gray-400 text-lg mb-6">كل المتاجر بمكان واحد.. اختار متجرك وبلش تسوق</p>
            <!-- شريط البحث -->
            <div class="glass rounded-2xl p-2 max-w-2xl mx-auto flex gap-2">
                <input id="searchInput" oninput="searchItems()" type="text" placeholder="ابحث عن متجر أو منتج..." class="flex-1 p-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
                <button class="btn-neon-blue px-6 rounded-xl"><i class="fa-solid fa-search"></i></button>
            </div>
        </div>

        <div class="glass rounded-3xl p-8 mb-12">
            <h3 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <i class="fa-solid fa-store text-blue-500"></i> المتاجر المتاحة
            </h3>
            <div id="companiesGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>
        </div>

        <div id="productsSection" class="hidden">
            <h3 id="productsTitle" class="text-3xl font-bold mb-8 flex items-center gap-3">
                <i class="fa-solid fa-box-open text-green-500"></i>
                منتجات <span id="currentCompany" class="gradient-text"></span>
            </h3>
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5"></div>
        </div>
    </div>

    <!-- السلة -->
    <div id="cartSidebar" class="fixed top-0 left-0 w-full md:w-[420px] h-full glass transform -translate-x-full transition-all duration-500 z-50 p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-3xl font-black gradient-text">سلتك</h3>
            <button onclick="toggleCart()" class="btn-neon-red w-10 h-10 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="cartItems" class="space-y-4 mb-6"></div>
        <div class="glass rounded-2xl p-5 mt-6">
            <div class="flex justify-between text-2xl font-black mb-5">
                <span>الإجمالي:</span>
                <span id="cartTotal" class="text-green-400">0 ل.س</span>
            </div>
            <input id="customerName" type="text" placeholder="الاسم الكامل" class="w-full p-4 mb-3 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="customerPhone" type="tel" placeholder="09xxxxxxxx" class="w-full p-4 mb-3 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <textarea id="customerAddress" placeholder="العنوان بالتفصيل" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none"></textarea>

            <!-- شام كاش -->
            <div class="bg-black rounded-xl p-4 mb-4 border border-gray-800">
                <label class="flex items-center gap-3 mb-3 cursor-pointer">
                    <input id="shamCashCheck" type="checkbox" class="w-5 h-5 accent-green-500">
                    <span class="font-bold"><i class="fa-solid fa-wallet text-green-500 ml-2"></i>دفع عبر شام كاش</span>
                </label>
                <input id="shamCashCode" type="text" placeholder="أدخل كود التحويل" class="w-full p-3 rounded-lg bg-gray-900 border border-gray-800 hidden">
            </div>

            <button onclick="submitOrder()" class="w-full btn-neon-green p-4 rounded-xl font-black text-lg">
                <i class="fa-solid fa-rocket ml-2"></i> تأكيد الطلب الآن
            </button>
        </div>
    </div>

    <!-- نافذة تتبع الطلب -->
    <div id="trackOrderModal" class="fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-lg border border-gray-800">
            <h3 class="text-2xl font-black mb-6 gradient-text">تتبع طلبك</h3>
            <input id="trackPhone" type="tel" placeholder="أدخل رقم الموبايل اللي طلبت فيه" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <button onclick="trackOrder()" class="btn-neon-blue w-full p-4 rounded-xl font-bold mb-4">بحث عن الطلب</button>
            <div id="trackResults" class="space-y-3"></div>
            <button onclick="closeTrackModal()" class="btn-neon-red w-full p-3 rounded-xl font-bold mt-4">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, serverTimestamp, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCH2eWEqV2XHlDzQ4_NN90Fn73gB6qzDA",
          authDomain: "flutter-ai-playground-55de8.firebaseapp.com",
          projectId: "flutter-ai-playground-55de8",
          storageBucket: "flutter-ai-playground-55de8.firebasestorage.app",
          messagingSenderId: "123646936115",
          appId: "1:123646936115:web:bb6b3db2cae8340ddc8f46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let cart = [];
        let currentCompanyId = null;
        let allCompanies = [];
        let allProducts = [];

        // شام كاش checkbox
        document.getElementById('shamCashCheck').addEventListener('change', (e) => {
            document.getElementById('shamCashCode').classList.toggle('hidden',!e.target.checked);
        });

        async function loadCompanies() {
            const querySnapshot = await getDocs(collection(db, "sheikh_companies"));
            allCompanies = querySnapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
            renderCompanies(allCompanies);
        }

        function renderCompanies(companies) {
            const grid = document.getElementById('companiesGrid');
            grid.innerHTML = companies.map(c => `
                <button onclick="loadCompanyProducts('${c.id}', '${c.name}')" class="card-glow p-5 rounded-2xl text-center group">
                    <div class="w-20 h-20 mx-auto rounded-2xl overflow-hidden mb-3 border-2 border-gray-800 group-hover:border-blue-500 transition-all">
                        <img src="${c.logo}" class="w-full h-full object-cover">
                    </div>
                    <p class="font-bold text-sm mb-1">${c.name}</p>
                    <p class="text-xs text-gray-500">${c.category}</p>
                </button>
            `).join('');
        }

        window.loadCompanyProducts = async (companyId, companyName) => {
            currentCompanyId = companyId;
            document.getElementById('productsSection').classList.remove('hidden');
            document.getElementById('currentCompany').textContent = companyName;
            window.scrollTo({top: document.getElementById('productsSection').offsetTop - 100, behavior: 'smooth'});

            const q = query(collection(db, "sheikh_products"), where("companyId", "==", companyId));
            const querySnapshot = await getDocs(q);
            allProducts = querySnapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map(p => `
                <div class="card-glow rounded-2xl overflow-hidden group">
                    <div class="relative overflow-hidden">
                        <img src="${p.image}" class="w-full h-48 object-cover group-hover:scale-110 transition-transform duration-500">
                        <div class="absolute top-3 right-3 btn-neon-green px-3 py-1 rounded-full text-xs font-bold">${p.price} ل.س</div>
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-sm h-10 mb-3">${p.name}</h3>
                        <button onclick='addToCart(${JSON.stringify({...p})})' class="w-full btn-neon-blue py-2 rounded-xl font-bold text-sm">
                            <i class="fa-solid fa-plus ml-1"></i> أضف للسلة
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.searchItems = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            if (!term) {
                renderCompanies(allCompanies);
                renderProducts(allProducts);
                return;
            }
            const filteredCompanies = allCompanies.filter(c => c.name.toLowerCase().includes(term) || c.category.toLowerCase().includes(term));
            const filteredProducts = allProducts.filter(p => p.name.toLowerCase().includes(term));
            renderCompanies(filteredCompanies);
            renderProducts(filteredProducts);
        }

        window.addToCart = (product) => {
            const existing = cart.find(i => i.id === product.id);
            if (existing) existing.qty++;
            else cart.push({...product, qty: 1, companyId: currentCompanyId });
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').textContent = cart.reduce((a,b) => a + b.qty, 0);
            const cartItems = document.getElementById('cartItems');
            let total = 0;
            cartItems.innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `
                    <div class="glass rounded-xl p-4 flex justify-between items-center">
                        <div class="flex-1">
                            <p class="font-bold">${item.name}</p>
                            <p class="text-xs text-gray-400">${item.price} × ${item.qty}</p>
                        </div>
                        <span class="font-black text-xl text-green-400">${item.price * item.qty}</span>
                    </div>
                `;
            }).join('');
            document.getElementById('cartTotal').textContent = total.toLocaleString() + ' ل.س';
        }

        window.toggleCart = () => document.getElementById('cartSidebar').classList.toggle('-translate-x-full');

        window.submitOrder = async () => {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;
            const shamCashPaid = document.getElementById('shamCashCheck').checked;
            const shamCashCode = document.getElementById('shamCashCode').value;

            if (!name ||!phone ||!address || cart.length === 0) return alert('عبي كل البيانات يا وحش');
            if (shamCashPaid &&!shamCashCode) return alert('أدخل كود تحويل شام كاش');

            const ordersByCompany = {};
            cart.forEach(item => {
                if (!ordersByCompany[item.companyId]) ordersByCompany[item.companyId] = [];
                ordersByCompany[item.companyId].push(item);
            });

            for (const [companyId, items] of Object.entries(ordersByCompany)) {
                await addDoc(collection(db, "sheikh_orders"), {
                    customer: { name, phone, address },
                    items: items,
                    total: items.reduce((a,b) => a + b.price * b.qty, 0),
                    status: "طلب جديد",
                    companyId: companyId,
                    paymentMethod: shamCashPaid? 'شام كاش' : 'كاش عند التسليم',
                    paymentCode: shamCashPaid? shamCashCode : null,
                    createdAt: serverTimestamp()
                });
            }
            alert('🚀 تم استلام طلبك بنجاح! احفظ رقمك لتتبع الطلب');
            cart = []; updateCart(); toggleCart();
        }

        window.showTrackOrder = () => document.getElementById('trackOrderModal').classList.remove('hidden');
        window.closeTrackModal = () => document.getElementById('trackOrderModal').classList.add('hidden');

        window.trackOrder = async () => {
            const phone = document.getElementById('trackPhone').value;
            if (!phone) return alert('أدخل رقم الموبايل');

            const q = query(collection(db, "sheikh_orders"), where("customer.phone", "==", phone));
            const querySnapshot = await getDocs(q);
            const results = document.getElementById('trackResults');

            if (querySnapshot.empty) {
                results.innerHTML = `<p class="text-center text-gray-500 py-8">ما في طلبات على هالرقم</p>`;
                return;
            }

            results.innerHTML = querySnapshot.docs.map(doc => {
                const o = doc.data();
                let statusClass = 'status-new';
                let statusIcon = 'fa-hourglass-start';
                if (o.status === 'قيد التحضير') { statusClass = 'status-prep'; statusIcon = 'fa-fire'; }
                if (o.status === 'تم التسليم') { statusClass = 'status-done'; statusIcon = 'fa-check-circle'; }

                return `
                    <div class="glass rounded-xl p-4">
                        <div class="flex justify-between items-center mb-3">
                            <p class="font-bold">طلب #${doc.id.slice(-6)}</p>
                            <span class="${statusClass} font-bold"><i class="fa-solid ${statusIcon} ml-1"></i>${o.status}</span>
                        </div>
                        <p class="text-sm text-gray-400 mb-2">${o.items.map(i => `${i.name} ×${i.qty}`).join(' • ')}</p>
                        <div class="flex justify-between text-sm">
                            <span>الإجمالي: ${o.total.toLocaleString()} ل.س</span>
                            <span class="text-blue-400">${o.paymentMethod}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        loadCompanies();
    </script>
</body>
</html>
