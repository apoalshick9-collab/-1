                                                       `).join('');
      <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيخ ستور | متاجرنا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #000; color: #fff; }
      .glass { background: rgba(20, 20, 20, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
      .card-glow { background: linear-gradient(145deg, #111, #0a0a0a); border: 1px solid #222; transition: all 0.3s; }
      .card-glow:hover { border-color: #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); transform: translateY(-4px); }
      .btn-neon-blue { background: #3b82f6; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
      .btn-neon-green { background: #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
      .btn-neon-red { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
      .gradient-text { background: linear-gradient(90deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      .modal { transition: all 0.3s; }
      .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="toast" class="fixed top-5 left-5 z-[100] hidden"></div>

    <header class="glass sticky top-0 z-40 p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="showCart()" class="btn-neon-blue px-4 py-2 rounded-xl font-bold flex items-center gap-2 relative">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M3 1a1 1 0 000 2h1.22l.305 1.222a.997.997 0 00.01.042l1.358 5.43-.893.892C3.74 11.846 4.632 14 6.414 14H15a1 1 0 000-2H6.414l1-1H14a1 1 0 00.894-.553l3-6A1 1 0 0017 3H6.28l-.31-1.243A1 1 0 005 1H3zM16 16.5a1.5 1.5 0 11-3 0 1.5 0 013 0zM6.5 18a1.5 1.5 0 100-3 1.5 0 000 3z"></path></svg>
                    <span>السلة</span>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="showOrderTracking()" class="btn-neon-green px-4 py-2 rounded-xl font-bold flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>
                    <span>تتبع طلبي</span>
                </button>
            </div>
            <h1 class="text-3xl font-black gradient-text">شيخ ستور</h1>
            <button onclick="window.location.href='./super-admin.html'" class="btn-neon-blue px-4 py-2 rounded-xl font-bold">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6">
        <div class="glass p-6 rounded-3xl mb-8">
            <div class="flex gap-3">
                <input id="searchInput" type="text" placeholder="ابحث عن متجر أو منتج..." class="flex-1 p-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none text-lg">
                <button onclick="searchAll()" class="btn-neon-blue px-8 py-4 rounded-xl font-bold">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </div>

        <div id="companiesSection">
            <h2 class="text-2xl font-black mb-6 flex items-center gap-3">
                <span class="gradient-text">المتاجر المتاحة</span>
                <svg class="w-7 h-7 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
            </h2>
            <div id="companiesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4"></div>
        </div>

        <div id="productsSection" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <button onclick="backToCompanies()" class="btn-neon-blue px-6 py-3 rounded-xl font-bold flex items-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"></path></svg>
                    <span>رجوع</span>
                </button>
                <h2 id="companyTitle" class="text-2xl font-black gradient-text"></h2>
            </div>
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
        </div>
    </main>

    <div id="cartModal" class="modal fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-2xl border border-gray-800 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-3xl font-black gradient-text">سلة المشتريات</h3>
                <button onclick="closeCart()" class="text-gray-400 hover:text-white">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
            <div id="cartItems" class="space-y-4 mb-6"></div>
            <div class="border-t border-gray-800 pt-6">
                <div class="flex items-center justify-between mb-6">
                    <span class="text-xl font-bold">المجموع:</span>
                    <span id="cartTotal" class="text-3xl font-black gradient-text">0 ل.س</span>
                </div>
                <button onclick="checkout()" class="btn-neon-green w-full p-4 rounded-xl font-bold text-lg">إتمام الطلب</button>
            </div>
        </div>
    </div>

    <div id="checkoutModal" class="modal fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-md border border-gray-800">
            <h3 class="text-2xl font-black mb-6 gradient-text">معلومات التوصيل</h3>
            <input id="customerName" type="text" placeholder="الاسم الكامل" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="customerPhone" type="tel" placeholder="رقم الهاتف" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="customerAddress" type="text" placeholder="العنوان بالتفصيل" class="w-full p-4 mb-6 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <div class="flex gap-3">
                <button onclick="submitOrder()" class="btn-neon-green flex-1 p-4 rounded-xl font-bold">تأكيد الطلب</button>
                <button onclick="closeCheckout()" class="btn-neon-red flex-1 p-4 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="trackingModal" class="modal fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="glass p-8 rounded-3xl w-full max-w-md border border-gray-800">
            <h3 class="text-2xl font-black mb-6 gradient-text">تتبع طلبك</h3>
            <input id="trackingCode" type="text" placeholder="كود الطلب" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <button onclick="trackOrder()" class="btn-neon-blue w-full p-4 rounded-xl font-bold mb-6">بحث</button>
            <div id="trackingResult" class="hidden"></div>
            <button onclick="closeTracking()" class="btn-neon-red w-full p-4 rounded-xl font-bold mt-4">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, addDoc, doc, getDoc, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXXfFQh5m8KEWzmtPsyF8rdgp1U-_XozY",
            authDomain: "a9test-9473a.firebaseapp.com",
            projectId: "a9test-9473a",
            storageBucket: "a9test-9473a.appspot.com",
            messagingSenderId: "580658637186",
            appId: "1:580658637186:web:a243a1862b875dca69d024"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cart = JSON.parse(localStorage.getItem('sheikh_cart') || '[]');
        let currentCompanyId = null;
        let allCompanies = [];

        window.onload = async () => {
            updateCartCount();
            await loadCompanies();
        };

        // التعديل الأساسي هون: شلت where("approved", "==", true)
        async function loadCompanies() {
            try {
                const snapshot = await getDocs(collection(db, "sheikh_companies"));
                allCompanies = snapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));
                console.log('Companies loaded:', allCompanies);
                renderCompanies(allCompanies);
            } catch (error) {
                console.error('Error loading companies:', error);
                showToast('خطأ بتحميل المتاجر', 'error');
            }
        }

        function renderCompanies(companies) {
            const grid = document.getElementById('companiesGrid');
            if (companies.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 text-lg py-12">لا توجد متاجر حالياً</p>';
                return;
            }

            grid.innerHTML = companies.map(c => {
                const logoSrc = c.logo || c.logoUrl || c.image || 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png';

                return `
                <button onclick="loadCompanyProducts('${c.id}', '${c.name}')" class="card-glow p-5 rounded-2xl text-center group">
                    <div class="w-20 h-20 mx-auto rounded-2xl overflow-hidden mb-3 border-2 border-gray-800 group-hover:border-blue-500 transition-all bg-gray-900 flex items-center justify-center">
                        <img src="${logoSrc}"
                             class="w-full h-full object-cover"
                             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3081/3081559.png';"
                             alt="${c.name}">
                    </div>
                    <p class="font-bold text-sm mb-1">${c.name}</p>
                    <p class="text-xs text-gray-500">${c.category || 'متجر'}</p>
                </button>
            `}).join('');
        }

        window.loadCompanyProducts = async (companyId, companyName) => {
            currentCompanyId = companyId;
            document.getElementById('companyTitle').textContent = companyName;
            document.getElementById('companiesSection').classList.add('hidden');
            document.getElementById('productsSection').classList.remove('hidden');

            console.log('Loading products for company:', companyId);

            const q = query(collection(db, "sheikh_products"), where("companyId", "==", companyId));
            const snapshot = await getDocs(q);
            const products = snapshot.docs.map(doc => ({ id: doc.id,...doc.data() }));

            console.log('Products found:', products);

            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 text-lg py-12">لا توجد منتجات حالياً</p>';
                return;
            }

            grid.innerHTML = products.map(p => `
                <div class="card-glow p-4 rounded-2xl">
                    <div class="w-full h-40 rounded-xl overflow-hidden mb-3 bg-gray-900">
                        <img src="${p.image || 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png'}"
                             class="w-full h-full object-cover"
                             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3081/3081559.png';"
                             alt="${p.name}">
                    </div>
                    <h3 class="font-bold text-lg mb-2">${p.name}</h3>
                    <p class="text-2xl font-black gradient-text mb-3">${p.price.toLocaleString()} ل.س</p>
                    <button onclick='addToCart(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-neon-blue w-full p-3 rounded-xl font-bold">
                        أضف للسلة
                    </button>
                </div>
            `).join('');
        };

        window.backToCompanies = () => {
            document.getElementById('productsSection').classList.add('hidden');
            document.getElementById('companiesSection').classList.remove('hidden');
            currentCompanyId = null;
        };

        window.addToCart = (product) => {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({...product, qty: 1 });
            }
            localStorage.setItem('sheikh_cart', JSON.stringify(cart));
            updateCartCount();
            showToast('تمت الإضافة للسلة ✓', 'success');
        };

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = count;
        }

        window.showCart = () => {
            const modal = document.getElementById('cartModal');
            const items = document.getElementById('cartItems');

            if (cart.length === 0) {
                items.innerHTML = '<p class="text-center text-gray-500 py-12">السلة فارغة</p>';
            } else {
                items.innerHTML = cart.map((item, idx) => `
                    <div class="glass p-4 rounded-xl flex items-center gap-4">
                        <img src="${item.image || 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png'}"
                             class="w-20 h-20 rounded-lg object-cover bg-gray-900"
                             onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/3081/3081559.png';">
                        <div class="flex-1">
                            <h4 class="font-bold mb-1">${item.name}</h4>
                            <p class="text-blue-400 font-bold">${item.price.toLocaleString()} ل.س</p>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="updateQty(${idx}, -1)" class="btn-neon-red w-8 h-8 rounded-lg font-bold">-</button>
                            <span class="font-bold text-lg w-8 text-center">${item.qty}</span>
                            <button onclick="updateQty(${idx}, 1)" class="btn-neon-green w-8 h-8 rounded-lg font-bold">+</button>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-500 hover:text-red-400">
                            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        </button>
                    </div>
                `).join('');
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartTotal').textContent = total.toLocaleString() + ' ل.س';
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeCart = () => {
            document.getElementById('cartModal').classList.add('hidden');
            document.getElementById('cartModal').classList.remove('flex');
        };

        window.updateQty = (idx, change) => {
            cart[idx].qty += change;
            if (cart[idx].qty <= 0) {
                cart.splice(idx, 1);
            }
            localStorage.setItem('sheikh_cart', JSON.stringify(cart));
            updateCartCount();
            showCart();
        };

        window.removeFromCart = (idx) => {
            cart.splice(idx, 1);
            localStorage.setItem('sheikh_cart', JSON.stringify(cart));
            updateCartCount();
            showCart();
        };

        window.checkout = () => {
            if (cart.length === 0) return showToast('السلة فارغة', 'error');
            closeCart();
            document.getElementById('checkoutModal').classList.remove('hidden');
            document.getElementById('checkoutModal').classList.add('flex');
        };

        window.closeCheckout = () => {
            document.getElementById('checkoutModal').classList.add('hidden');
            document.getElementById('checkoutModal').classList.remove('flex');
        };

        window.submitOrder = async () => {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;

            if (!name ||!phone ||!address) {
                return showToast('الرجاء ملء جميع الحقول', 'error');
            }

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const code = 'SHK' + Math.random().toString(36).substr(2, 6).toUpperCase();

            await addDoc(collection(db, "sheikh_orders"), {
                code,
                customer: { name, phone, address },
                items: cart,
                total,
                status: 'جديد',
                createdAt: new Date().toISOString()
            });

            cart = [];
            localStorage.setItem('sheikh_cart', JSON.stringify(cart));
            updateCartCount();
            closeCheckout();
            showToast(`تم الطلب بنجاح! كود التتبع: ${code}`, 'success');

            document.getElementById('customerName').value = '';
            document.getElementById('customerPhone').value = '';
            document.getElementById('customerAddress').value = '';
        };

        window.showOrderTracking = () => {
            document.getElementById('trackingModal').classList.remove('hidden');
            document.getElementById('trackingModal').classList.add('flex');
        };

        window.closeTracking = () => {
            document.getElementById('trackingModal').classList.add('hidden');
            document.getElementById('trackingModal').classList.remove('flex');
            document.getElementById('trackingResult').classList.add('hidden');
            document.getElementById('trackingCode').value = '';
        };

        window.trackOrder = async () => {
            const code = document.getElementById('trackingCode').value.trim().toUpperCase();
            if (!code) return showToast('أدخل كود الطلب', 'error');

            const q = query(collection(db, "sheikh_orders"), where("code", "==", code), limit(1));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                return showToast('لم يتم العثور على الطلب', 'error');
            }

            const order = snapshot.docs[0].data();
            const result = document.getElementById('trackingResult');

            const statusColors = {
                'جديد': 'bg-blue-500',
                'قيد التجهيز': 'bg-yellow-500',
                'قيد التوصيل': 'bg-purple-500',
                'تم التوصيل': 'bg-green-500',
                'ملغي': 'bg-red-500'
            };

            result.innerHTML = `
                <div class="glass p-6 rounded-xl">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm text-gray-400">كود الطلب</span>
                        <span class="font-bold text-lg">${order.code}</span>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm text-gray-400">الحالة</span>
                        <span class="px-4 py-2 rounded-lg font-bold ${statusColors[order.status]} text-white">${order.status}</span>
                    </div>
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-sm text-gray-400">المجموع</span>
                        <span class="font-bold text-lg gradient-text">${order.total.toLocaleString()} ل.س</span>
                    </div>
                    <div class="border-t border-gray-800 pt-4">
                        <p class="text-sm text-gray-400 mb-2">المنتجات:</p>
                        ${order.items.map(item => `
                            <div class="flex justify-between text-sm mb-1">
                                <span>${item.name} × ${item.qty}</span>
                                <span>${(item.price * item.qty).toLocaleString()} ل.س</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            result.classList.remove('hidden');
        };

        window.searchAll = async () => {
            const term = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!term) return loadCompanies();

            const filtered = allCompanies.filter(c =>
                c.name.toLowerCase().includes(term) ||
                (c.category && c.category.toLowerCase().includes(term))
            );
            renderCompanies(filtered);
        };

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
            toast.innerHTML = `<div class="toast ${colors[type]} text-white px-6 py-4 rounded-xl font-bold shadow-lg">${msg}</div>`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchAll();
        });
    </script>
</body>
</html>
