<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوبر أدمن - متجر الشيخ للهواتف</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0a; --bg-card: #121212; --red-accent: #e63946;
            --blue-accent: #00a8e8; --green-accent: #2ecc71; --text-main: #f1f1f1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Cairo", sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid #222; width: 90%; max-width: 400px; text-align: center; }
    .login-box h1 { font-family: "Tajawal", sans-serif; color: var(--blue-accent); margin-bottom: 30px; }
    .dashboard { display: none; padding: 20px; }
        nav { background: linear-gradient(90deg, #000, #1a1a1a); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--red-accent); margin-bottom: 30px; }
    .logo { font-family: "Tajawal", sans-serif; font-size: 24px; font-weight: 900; color: var(--blue-accent); }
    .container { max-width: 1400px; margin: 0 auto; }
    .section { background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid #222; margin-bottom: 20px; }
        h2 { font-family: "Tajawal", sans-serif; color: var(--blue-accent); margin-bottom: 20px; font-size: 28px; }
    .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: var(--blue-accent); font-weight: 700; }
        input { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: var(--text-main); font-size: 16px; }
    .btn { display: inline-block; background: linear-gradient(45deg, var(--red-accent), var(--blue-accent)); color: white; padding: 12px 25px; border-radius: 8px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; }
    .btn-red { background: var(--red-accent); }
    .btn-sm { padding: 8px 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #222; }
        th { background: #1a1a1a; color: var(--blue-accent); font-weight: 700; }
    .company-logo { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1><i class="fa-solid fa-user-shield"></i> سوبر أدمن</h1>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="كلمة السر" onkeypress="if(event.key==='Enter') checkLogin()">
            </div>
            <button class="btn" onclick="checkLogin()">دخول</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <nav>
            <div class="logo"><i class="fa-solid fa-bolt"></i> سوبر أدمن - متجر الشيخ</div>
            <button class="btn btn-red" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </nav>
        <div class="container">
            <div class="section">
                <h2>إضافة شركة / براند جديد</h2>
                <form id="companyForm">
                    <div class="form-group">
                        <label>اسم الشركة</label>
                        <input type="text" id="companyName" required>
                    </div>
                    <div class="form-group">
                        <label>رابط اللوجو</label>
                        <input type="url" id="companyLogo" placeholder="https://..." required>
                    </div>
                    <div class="form-group">
                        <label>إيميل أدمن الشركة</label>
                        <input type="email" id="companyEmail" required>
                    </div>
                    <div class="form-group">
                        <label>كلمة سر أدمن الشركة</label>
                        <input type="text" id="companyPassword" required>
                    </div>
                    <div class="form-group">
                        <label>رقم شام كاش - اختياري</label>
                        <input type="text" id="companyShamcash" placeholder="09xxxxxxxx">
                    </div>
                    <button type="submit" class="btn"><i class="fa-solid fa-plus"></i> إضافة شركة</button>
                </form>
            </div>

            <div class="section">
                <h2>الشركات المضافة</h2>
                <table id="companiesTable">
                    <thead>
                        <tr>
                            <th>اللوجو</th>
                            <th>الاسم</th>
                            <th>إيميل الأدمن</th>
                            <th>كلمة السر</th>
                            <th>شام كاش</th>
                            <th>حذف</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCN1ZMiCUkuQiPZUzihRRkRR2tf_AnPqGQ",
          authDomain: "apoalshick4store.firebaseapp.com",
          projectId: "apoalshick4store",
          storageBucket: "apoalshick4store.firebasestorage.app",
          messagingSenderId: "973040858310",
          appId: "1:973040858310:web:eafb4e1a4b6d49cf1913c7",
          measurementId: "G-6JZ1XS8CK2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ADMIN_PASSWORD = "kali";

        window.checkLogin = function() {
            if(document.getElementById('passwordInput').value === ADMIN_PASSWORD) {
                document.getElementById('loginContainer').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadCompanies();
            } else {
                alert('كلمة السر غلط');
            }
        }

        window.logout = function() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('passwordInput').value = '';
        }

        async function loadCompanies() {
            const tbody = document.querySelector('#companiesTable tbody');
            const snapshot = await getDocs(collection(db, "phone_companies"));
            tbody.innerHTML = '';
            snapshot.forEach(docSnap => {
                const c = docSnap.data();
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${c.logo}" class="company-logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081559.png'"></td>
                        <td>${c.name}</td>
                        <td>${c.email}</td>
                        <td>${c.password}</td>
                        <td>${c.shamcash || '-'}</td>
                        <td><button class="btn btn-red btn-sm" onclick="deleteCompany('${docSnap.id}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('companyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('companyName').value.trim();
            const logo = document.getElementById('companyLogo').value.trim();
            const email = document.getElementById('companyEmail').value.trim();
            const password = document.getElementById('companyPassword').value.trim();
            const shamcash = document.getElementById('companyShamcash').value.trim();

            await addDoc(collection(db, "phone_companies"), { name, logo, email, password, shamcash, category: 'هواتف' });
            alert('تمت إضافة الشركة');
            this.reset();
            loadCompanies();
        });

        window.deleteCompany = async function(id) {
            if(!confirm('متأكد من حذف الشركة؟ رح تنحذف كل منتجاتها وطلباتها')) return;

            const productsQuery = query(collection(db, "phone_products"), where("companyId", "==", id));
            const productsSnapshot = await getDocs(productsQuery);
            for (const p of productsSnapshot.docs) {
                await deleteDoc(doc(db, "phone_products", p.id));
            }

            await deleteDoc(doc(db, "phone_companies", id));
            loadCompanies();
        }
    </script>
</body>
</html>
