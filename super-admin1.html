  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم شيخ ستور الرئيسية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: "Cairo", sans-serif; background: #000000; }
        .btn-green { background: #10B981; }
        .btn-red { background: #EF4444; }
        .btn-blue { background: #3B82F6; }
    </style>
</head>
<body class="text-white p-6">
    <h1 class="text-3xl font-black mb-6"><span class="text-blue-500">شيخ ستور</span> | السوبر أدمن</h1>
    
    <button onclick="showAddCompany()" class="btn-green px-6 py-3 rounded-lg mb-6 font-bold">
        <i class="fa-solid fa-building"></i> إضافة شركة جديدة
    </button>

    <h2 class="text-2xl font-bold mb-4">الشركات المسجلة</h2>
    <div id="companiesList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

    <!-- نافذة إضافة شركة -->
    <div id="addCompanyModal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-50">
        <div class="bg-gray-900 p-6 rounded-xl w-96 border border-gray-800">
            <h3 class="text-xl font-bold mb-4">إضافة شركة جديدة</h3>
            <input id="cName" type="text" placeholder="اسم الشركة" class="w-full p-2 mb-3 rounded bg-black border border-gray-800">
            <input id="cCategory" type="text" placeholder="المجال: مطعم، اتصالات..." class="w-full p-2 mb-3 rounded bg-black border border-gray-800">
            <input id="cLogo" type="text" placeholder="رابط اللوغو" class="w-full p-2 mb-3 rounded bg-black border border-gray-800">
            <input id="cUsername" type="text" placeholder="اسم مستخدم الأدمن" class="w-full p-2 mb-3 rounded bg-black border border-gray-800">
            <input id="cPassword" type="password" placeholder="كلمة مرور الأدمن" class="w-full p-2 mb-3 rounded bg-black border border-gray-800">
            <div class="flex gap-2">
                <button onclick="saveCompany()" class="btn-green flex-1 p-2 rounded">حفظ</button>
                <button onclick="closeModal()" class="btn-red flex-1 p-2 rounded">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCH2eWEqV2XHlDzQ4_NN90Fn73gB6qzDA",
          authDomain: "flutter-ai-playground-55de8.firebaseapp.com",
          projectId: "flutter-ai-playground-55de8",
          storageBucket: "flutter-ai-playground-55de8.firebasestorage.app",
          messagingSenderId: "123646936115",
          appId: "1:123646936115:web:bb6b3db2cae8340ddc8f46"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "sheikh_companies"), (snapshot) => {
            const list = document.getElementById('companiesList');
            list.innerHTML = snapshot.docs.map(docSnap => {
                const c = docSnap.data();
                return `
                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
                        <div class="flex items-center gap-3 mb-3">
                            <img src="${c.logo}" class="w-12 h-12 rounded-full object-cover">
                            <div>
                                <p class="font-bold">${c.name}</p>
                                <p class="text-xs text-gray-500">${c.category}</p>
                            </div>
                        </div>
                        <p class="text-xs text-gray-400 mb-2">يوزر: ${c.username}</p>
                        <div class="flex gap-2">
                            <a href="company-admin.html?id=${docSnap.id}" target="_blank" class="btn-blue px-3 py-1 rounded text-xs">فتح لوحة التحكم</a>
                            <button onclick="deleteCompany('${docSnap.id}')" class="btn-red px-3 py-1 rounded text-xs">حذف</button>
                        </div>
                    </div>
                `;
            }).join('');
        });

        window.showAddCompany = () => document.getElementById('addCompanyModal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('addCompanyModal').classList.add('hidden');

        window.saveCompany = async () => {
            await addDoc(collection(db, "sheikh_companies"), {
                name: document.getElementById('cName').value,
                category: document.getElementById('cCategory').value,
                logo: document.getElementById('cLogo').value,
                username: document.getElementById('cUsername').value,
                password: document.getElementById('cPassword').value
            });
            closeModal();
        }

        window.deleteCompany = async (id) => {
            if(confirm('متأكد؟ رح تنحذف كل منتجات وطلبات الشركة')) await deleteDoc(doc(db, "sheikh_companies", id));
        }
    </script>
</body>
</html>
