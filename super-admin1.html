     <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم الملكية - شيخ ستور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { font-family: "Cairo", sans-serif; }
        body { background: #000000; }
       .glass {
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
       .btn-neon-green { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
       .btn-neon-red { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }
       .btn-neon-blue { background: linear-gradient(135deg, #3B82F6, #1D4ED8); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
       .gradient-text { background: linear-gradient(90deg, #3B82F6, #10B981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="text-white p-6">
    <div class="container mx-auto">
        <div class="glass rounded-3xl p-8 mb-8">
            <h1 class="text-4xl font-black mb-2"><i class="fa-solid fa-crown text-yellow-500 ml-3"></i>لوحة التحكم <span class="gradient-text">الملكية</span></h1>
            <p class="text-gray-400">إدارة المول الإلكتروني بالكامل من هون</p>
        </div>

        <button onclick="showAddCompany()" class="btn-neon-green px-8 py-4 rounded-2xl mb-8 font-black text-lg">
            <i class="fa-solid fa-building ml-2"></i> إضافة شركة جديدة
        </button>

        <div class="glass rounded-3xl p-8">
            <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
                <i class="fa-solid fa-building-columns text-blue-500"></i> الشركات المسجلة
            </h2>
            <div id="companiesList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <div id="addCompanyModal" class="fixed inset-0 bg-black bg-opacity-90 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="glass p-8 rounded-3xl w-full max-w-md border border-gray-800">
            <h3 class="text-2xl font-black mb-6 gradient-text">إضافة شركة جديدة</h3>
            <input id="cName" type="text" placeholder="اسم الشركة" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="cCategory" type="text" placeholder="المجال: مطعم، اتصالات..." class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="cLogo" type="text" placeholder="رابط اللوغو" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="cUsername" type="text" placeholder="اسم مستخدم الأدمن" class="w-full p-4 mb-4 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <input id="cPassword" type="password" placeholder="كلمة مرور الأدمن" class="w-full p-4 mb-6 rounded-xl bg-black border border-gray-800 focus:border-blue-500 outline-none">
            <div class="flex gap-3">
                <button onclick="saveCompany()" class="btn-neon-green flex-1 p-4 rounded-xl font-bold">حفظ الشركة</button>
                <button onclick="closeModal()" class="btn-neon-red flex-1 p-4 rounded-xl font-bold">إلغاء</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDCH2eWEqV2XHlDzQ4_NN90Fn73gB6qzDA",
          authDomain: "flutter-ai-playground-55de8.firebaseapp.com",
          projectId: "flutter-ai-playground-55de8",
          storageBucket: "flutter-ai-playground-55de8.firebasestorage.app",
          messagingSenderId: "123646936115",
          appId: "1:123646936115:web:bb6b3db2cae8340ddc8f46"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        onSnapshot(collection(db, "sheikh_companies"), (snapshot) => {
            const list = document.getElementById('companiesList');
            list.innerHTML = snapshot.docs.map(docSnap => {
                const c = docSnap.data();
                return `
                    <div class="glass rounded-2xl p-6 border border-gray-800 hover:border-blue-500 transition-all">
                        <div class="flex items-center gap-4 mb-4">
                            <img src="${c.logo}" class="w-16 h-16 rounded-2xl object-cover border-2 border-gray-800">
                            <div>
                                <p class="font-black text-lg">${c.name}</p>
                                <p class="text-sm text-blue-400">${c.category}</p>
                            </div>
                        </div>
                        <div class="bg-black rounded-xl p-3 mb-4">
                            <p class="text-xs text-gray-500">بيانات الدخول:</p>
                            <p class="text-sm"><i class="fa-solid fa-user text-green-500 ml-1"></i> ${c.username}</p>
                        </div>
                        <div class="flex gap-2">
                            <a href="company-admin.html?id=${docSnap.id}" target="_blank" class="btn-neon-blue flex-1 px-4 py-2 rounded-xl text-sm font-bold text-center">
                                <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i> فتح
                            </a>
                            <button onclick="deleteCompany('${docSnap.id}')" class="btn-neon-red px-4 py-2 rounded-xl">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        });

        window.showAddCompany = () => document.getElementById('addCompanyModal').classList.remove('hidden');
        window.closeModal = () => document.getElementById('addCompanyModal').classList.add('hidden');

        window.saveCompany = async () => {
            await addDoc(collection(db, "sheikh_companies"), {
                name: document.getElementById('cName').value,
                category: document.getElementById('cCategory').value,
                logo: document.getElementById('cLogo').value,
                username: document.getElementById('cUsername').value,
                password: document.getElementById('cPassword').value
            });
            closeModal();
            document.querySelectorAll('#addCompanyModal input').forEach(i => i.value = '');
        }

        window.deleteCompany = async (id) => {
            if(confirm('⚠️ متأكد؟ رح تنحذف الشركة مع كل منتجاتها وطلباتها نهائياً')) await deleteDoc(doc(db, "sheikh_companies", id));
        }
    </script>
</body>
</html>
