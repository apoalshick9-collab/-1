<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الشركة - متجر الشيخ</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0a0a; --bg-card: #121212; --red-accent: #e63946;
            --blue-accent: #00a8e8; --green-accent: #2ecc71; --orange-accent: #f39c12; --text-main: #f1f1f1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Cairo", sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
      .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
      .login-box { background: var(--bg-card); padding: 40px; border-radius: 16px; border: 1px solid #222; width: 90%; max-width: 400px; text-align: center; }
      .login-box h1 { font-family: "Tajawal", sans-serif; color: var(--blue-accent); margin-bottom: 30px; }
      .dashboard { display: none; padding: 20px; }
        nav { background: linear-gradient(90deg, #000, #1a1a1a); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--red-accent); margin-bottom: 30px; }
      .logo { font-family: "Tajawal", sans-serif; font-size: 24px; font-weight: 900; color: var(--blue-accent); }
      .nav-links { display: flex; gap: 20px; }
      .nav-links button { background: none; border: none; color: var(--text-main); font-size: 16px; font-weight: 600; padding: 8px 15px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
      .nav-links button.active,.nav-links button:hover { color: var(--red-accent); background-color: rgba(230, 57, 70, 0.1); }
      .container { max-width: 1400px; margin: 0 auto; }
      .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
      .stat-card { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid #222; text-align: center; }
      .stat-card i { font-size: 40px; margin-bottom: 15px; }
      .stat-card h3 { font-size: 32px; margin-bottom: 5px; }
      .section { display: none; background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid #222; margin-bottom: 20px; }
      .section.active { display: block; }
        h2 { font-family: "Tajawal", sans-serif; color: var(--blue-accent); margin-bottom: 20px; font-size: 28px; }
      .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; color: var(--blue-accent); font-weight: 700; }
        input, textarea { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: var(--text-main); font-size: 16px; }
      .btn { display: inline-block; background: linear-gradient(45deg, var(--red-accent), var(--blue-accent)); color: white; padding: 12px 25px; border-radius: 8px; font-weight: 700; font-size: 16px; border: none; cursor: pointer; }
      .btn-green { background: var(--green-accent); }
      .btn-red { background: var(--red-accent); }
      .btn-sm { padding: 8px 15px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #222; }
        th { background: #1a1a1a; color: var(--blue-accent); font-weight: 700; }
      .product-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; }
      .status { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; }.status-new { background: rgba(46, 204, 113, 0.2); color: var(--green-accent); }
      .status-processing { background: rgba(243, 156, 18, 0.2); color: var(--orange-accent); }
      .status-done { background: rgba(0, 168, 232, 0.2); color: var(--blue-accent); }
      .export-bar { margin-bottom: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1><i class="fa-solid fa-building"></i> لوحة الشركة</h1>
            <div class="form-group">
                <input type="email" id="emailInput" placeholder="إيميل الأدمن">
            </div>
            <div class="form-group">
                <input type="password" id="passwordInput" placeholder="كلمة السر" onkeypress="if(event.key==='Enter') checkLogin()">
            </div>
            <button class="btn" onclick="checkLogin()">دخول</button>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <nav>
            <div class="logo" id="companyLogoNav"><i class="fa-solid fa-mobile"></i> <span id="companyNameNav"></span></div>
            <div class="nav-links">
                <button class="active" onclick="showSection('stats', this)">الإحصائيات</button>
                <button onclick="showSection('products', this)">المنتجات</button>
                <button onclick="showSection('orders', this)">الطلبات</button>
                <button onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
            </div>
        </nav>
        <div class="container">
            <div class="section active" id="stats">
                <h2>نظرة عامة</h2>
                <div class="stats">
                    <div class="stat-card">
                        <i class="fa-solid fa-box" style="color: var(--blue-accent);"></i>
                        <h3 id="totalProducts">0</h3>
                        <p>منتجاتي</p>
                    </div>
                    <div class="stat-card">
                        <i class="fa-solid fa-cart-shopping" style="color: var(--green-accent);"></i>
                        <h3 id="totalOrders">0</h3>
                        <p>طلباتي</p>
                    </div>
                    <div class="stat-card">
                        <i class="fa-solid fa-dollar-sign" style="color: var(--red-accent);"></i>
                        <h3 id="totalRevenue">$0</h3>
                        <p>مبيعاتي</p>
                    </div>
                    <div class="stat-card">
                        <i class="fa-solid fa-clock" style="color: var(--orange-accent);"></i>
                        <h3 id="newOrders">0</h3>
                        <p>طلبات جديدة</p>
                    </div>
                </div>
            </div>

            <div class="section" id="products">
                <h2>إدارة المنتجات</h2>
                <form id="productForm">
                    <div class="form-group">
                        <label>اسم المنتج</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label>السعر $</label>
                        <input type="number" id="productPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>رابط الصورة</label>
                        <input type="url" id="productImage" placeholder="https://..." required>
                    </div>
                    <button type="submit" class="btn btn-green"><i class="fa-solid fa-plus"></i> إضافة منتج</button>
                </form>
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>السعر</th>
                            <th>إجراءات</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div><div class="section" id="orders">
                <h2>طلبات متجري</h2>
                <div class="export-bar">
                    <button class="btn btn-green" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> تصدير Excel</button>
                </div>
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>الزبون</th>
                            <th>الجوال</th>
                            <th>المجموع</th>
                            <th>الحالة</th>
                            <th>تحديث</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc, updateDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
          apiKey: "AIzaSyCN1ZMiCUkuQiPZUzihRRkRR2tf_AnPqGQ",
          authDomain: "apoalshick4store.firebaseapp.com",
          projectId: "apoalshick4store",
          storageBucket: "apoalshick4store.firebasestorage.app",
          messagingSenderId: "973040858310",
          appId: "1:973040858310:web:eafb4e1a4b6d49cf1913c7",
          measurementId: "G-6JZ1XS8CK2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let currentCompanyId = null;
        let currentCompanyName = '';

        window.checkLogin = async function() {
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            const q = query(collection(db, "phone_companies"), where("email", "==", email), where("password", "==", password));
            const snapshot = await getDocs(q);

            if(snapshot.empty) {
                alert('الإيميل أو كلمة السر غلط');
                return;
            }

            const companyDoc = snapshot.docs[0];
            currentCompanyId = companyDoc.id;
            currentCompanyName = companyDoc.data().name;

            document.getElementById('companyNameNav').textContent = currentCompanyName;
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            loadStats();
            loadProducts();
            loadOrders();
        }

        window.logout = function() {
            document.getElementById('loginContainer').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
            currentCompanyId = null;
        }

        window.showSection = function(sectionId, element) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            document.querySelectorAll('.nav-links button').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
        }

        async function loadStats() {
            const productsQuery = query(collection(db, "phone_products"), where("companyId", "==", currentCompanyId));
            const ordersQuery = query(collection(db, "phone_orders"), where("companyId", "==", currentCompanyId));

            const productsSnapshot = await getDocs(productsQuery);
            const ordersSnapshot = await getDocs(ordersQuery);

            document.getElementById('totalProducts').textContent = productsSnapshot.size;
            document.getElementById('totalOrders').textContent = ordersSnapshot.size;
            let revenue = 0, newCount = 0;
            ordersSnapshot.forEach(doc => {
                const order = doc.data();
                revenue += order.total || 0;
                if(order.status === 'جديد') newCount++;
            });
            document.getElementById('totalRevenue').textContent = `$${revenue.toFixed(2)}`;
            document.getElementById('newOrders').textContent = newCount;
        }

        async function loadProducts() {
            const tbody = document.querySelector('#productsTable tbody');
            const q = query(collection(db, "phone_products"), where("companyId", "==", currentCompanyId));
            const snapshot = await getDocs(q);

            if(snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary)">لا توجد منتجات</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            snapshot.forEach(docSnap => {
                const product = docSnap.data();
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${product.image}" class="product-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3081/3081559.png'"></td>
                        <td>${product.name}</td>
                        <td>$${product.price}</td>
                        <td><button class="btn btn-red btn-sm" onclick="deleteProduct('${docSnap.id}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('productName').value.trim();
            const price = parseFloat(document.getElementById('productPrice').value);
            const image = document.getElementById('productImage').value.trim();

            await addDoc(collection(db, "phone_products"), { name, price, image, companyId: currentCompanyId, companyName: currentCompanyName });
            alert('تمت إضافة المنتج');
            this.reset();
            loadProducts();
            loadStats();
        });

        window.deleteProduct = async function(id) {
            if(!confirm('متأكد من الحذف؟')) return;
            await deleteDoc(doc(db, "phone_products", id));
            loadProducts();
            loadStats();
        }

        async function loadOrders() {
            const tbody = document.querySelector('#ordersTable tbody');
            const q = query(collection(db, "phone_orders"), where("companyId", "==", currentCompanyId));
            const snapshot = await getDocs(q);

            if(snapshot.empty) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-secondary)">لا توجد طلبات</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            snapshot.forEach(docSnap => {
                const order = docSnap.data();
                const date = new Date(order.date).toLocaleDateString('ar-SA');
                let statusClass = 'status-new';
                if(order.status === 'قيد التجهيز') statusClass = 'status-processing';
                if(order.status === 'تم التوصيل') statusClass = 'status-done';

                tbody.innerHTML += `
                    <tr>
                        <td>${date}</td>
                        <td>${order.customer.name}</td>
                        <td>${order.customer.phone}</td>
                        <td>$${order.total.toFixed(2)}</td>
                        <td><span class="status ${statusClass}">${order.status}</span></td>
                        <td>
                            <select onchange="updateOrderStatus('${docSnap.id}', this.value)" style="padding:5px;background:#1a1a1a;color:#fff;border:1px solid #333;border-radius:5px;"><option value="جديد" ${order.status === 'جديد'? 'selected' : ''}>جديد</option>
                                <option value="قيد التجهيز" ${order.status === 'قيد التجهيز'? 'selected' : ''}>قيد التجهيز</option>
                                <option value="تم التوصيل" ${order.status === 'تم التوصيل'? 'selected' : ''}>تم التوصيل</option>
                            </select>
                        </td>
                    </tr>
                ;
            });
        }

        window.updateOrderStatus = async function(orderId, newStatus) {
            await updateDoc(doc(db, "phone_orders", orderId), { status: newStatus });
            loadOrders();
            loadStats();
        }

        window.exportToExcel = function() {
            const table = document.querySelector('#ordersTable');
            if (!table || table.rows.length <= 1) {
                alert('لا يوجد طلبات للتصدير');
                return;
            }

            let csv = [];
            const rows = table.querySelectorAll('tr');
            for (let row of rows) {
                let cols = row.querySelectorAll('td, th');
                let rowData = [];
                for (let i = 0; i < cols.length - 1; i++) {
                    let text = cols[i].innerText.replace(/"/g, '""');
                    rowData.push('"' + text + '"');
                }
                csv.push(rowData.join(','));
            }

            const csvContent = '\uFEFF' + csv.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', طلبات_${currentCompanyName}_${new Date().toLocaleDateString('en-GB').replace(/\//g, '-')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
